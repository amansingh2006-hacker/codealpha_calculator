<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
:root{--bg:#1d2b3a;--body:#f2efe6;--key:#fffdf7;--key-shadow:#c9c4b4;--op:#2f6f5e;--op-text:#fff;--clear:#c4473a;--ink:#1d2b3a;--screen:#c8d8c0;--muted:#5c6b76;--panel:#e7e2d3}
:root[data-theme=dark]{--body:#2a3a4c;--key:#3a4d63;--key-shadow:#16212d;--ink:#f2efe6;--screen:#a9c2a0;--muted:#9fb0c0;--panel:#22303f}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",sans-serif;padding:16px;min-height:100vh}
.calc{position:relative;width:min(360px,100%);background:var(--body);color:var(--ink);border-radius:22px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.35);overflow:hidden}
.top{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.top .sp{flex:1}
.pill{font:inherit;font-size:.78rem;padding:6px 11px;border-radius:99px;border:1.5px solid var(--op);background:transparent;color:var(--ink);cursor:pointer;box-shadow:none;width:auto}
.pill.on{background:var(--op);color:#fff}
.mem{font-size:.75rem;color:var(--muted);min-width:1.4em}
.screen{background:var(--screen);color:#1d2b3a;border-radius:12px;padding:12px 14px;margin-bottom:12px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 3px 6px rgba(0,0,0,.2)}
.expr{font-family:"Courier New",monospace;font-size:1.05rem;min-height:1.4em;opacity:.75;overflow-x:auto;white-space:nowrap}
.result{font-family:"Courier New",monospace;font-size:2.3rem;font-weight:700;overflow-x:auto;white-space:nowrap}
.result.err{font-size:1.2rem;color:#8c2f26}
.result.pv{opacity:.55}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sci{display:none;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:9px}
.sci.show{display:grid}
.memrow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:9px}
button{font:inherit;font-size:1.25rem;padding:14px 0;border:0;border-radius:12px;background:var(--key);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--key-shadow);transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.07)}
button:active,button.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--key-shadow)}
button:focus-visible{outline:3px solid #e0a82e;outline-offset:2px}
.small{font-size:.95rem;padding:10px 0}
.op{background:var(--op);color:var(--op-text);box-shadow:0 4px 0 #1d4a3f}
.clear{background:var(--clear);color:#fff;box-shadow:0 4px 0 #8c2f26}
.eq{grid-row:span 2;background:#e0a82e;color:#1d2b3a;box-shadow:0 4px 0 #a97c14}
.zero{grid-column:span 2}
.pill:active{transform:none}
/* history drawer */
.hist{position:absolute;inset:0;background:var(--panel);color:var(--ink);padding:16px;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s;z-index:5}
.hist.open{transform:none}
.hist header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist h2{margin:0;font-size:1.1rem}
.hist ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.hist li{padding:10px;border-radius:10px;cursor:pointer;text-align:right}
.hist li:hover,.hist li:focus-visible{background:rgba(127,127,127,.18);outline:none}
.hist li small{display:block;color:var(--muted);font-family:"Courier New",monospace}
.hist li b{font-family:"Courier New",monospace;font-size:1.2rem}
.hist .none{color:var(--muted);text-align:center;margin-top:30px}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(20px);background:#1d2b3a;color:#fff;padding:7px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="calc" aria-label="Calculator" id="calc">
  <div class="top">
    <button class="pill" id="sciBtn" aria-pressed="false">Scientific</button>
    <button class="pill" id="angle" title="Angle mode for sin, cos, tan">DEG</button>
    <span class="mem" id="mem" aria-label="Memory"></span>
    <span class="sp"></span>
    <button class="pill" id="histBtn">History</button>
    <button class="pill" id="theme" aria-label="Switch theme">🌓</button>
  </div>
  <div class="screen" role="status" aria-live="polite" id="screen" title="Click to copy result">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="sci" id="sci">
    <button class="small" data-k="sqrt(">√</button><button class="small" data-k="^">xʸ</button><button class="small" data-k="sq">x²</button><button class="small" data-k="inv">1/x</button>
    <button class="small" data-k="sin(">sin</button><button class="small" data-k="cos(">cos</button><button class="small" data-k="tan(">tan</button><button class="small" data-k="π">π</button>
    <button class="small" data-k="ln(">ln</button><button class="small" data-k="log(">log</button><button class="small" data-k="e">e</button><button class="small" data-k="abs(">|x|</button>
  </div>
  <div class="memrow">
    <button class="small" data-k="MC">MC</button><button class="small" data-k="MR">MR</button><button class="small" data-k="M-">M−</button><button class="small" data-k="M+">M+</button>
  </div>
  <div class="keys">
    <button class="clear" data-k="AC">AC</button>
    <button data-k="Backspace" aria-label="Delete last character">⌫</button>
    <button data-k="(" >(</button>
    <button data-k=")">)</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="÷">÷</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="×">×</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="−">−</button>
    <button data-k="±" aria-label="Change sign">±</button><button data-k="0">0</button><button data-k=".">.</button>
    <button class="op" data-k="+">+</button>
    <button data-k="%">%</button>
    <button class="eq" data-k="=" style="grid-column:span 3;grid-row:auto">=</button>
  </div>

  <section class="hist" id="hist" aria-label="History">
    <header><h2>History</h2><span><button class="pill" id="clearHist">Clear</button> <button class="pill" id="closeHist">Close</button></span></header>
    <ul id="histList"></ul>
  </section>
  <div class="toast" id="toast"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const exprEl = $('expr'), resEl = $('result');
const OPS = '+−×÷^';
let expr = '', done = false, deg = true, memory = 0, history = [];
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
history = store.get('calc-hist', []);
memory = store.get('calc-mem', 0);

// ---------- Safe expression evaluator (no eval) ----------
function evaluate(src){
  let s = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt(');
  const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
  s += ')'.repeat(Math.max(0, open));          // auto-close brackets
  s = s.replace(/\s+/g,'');
  let i = 0;
  const bad = m => { throw new Error(m || 'Invalid expression'); };
  function expr_(){
    let v = term();
    while(s[i] === '+' || s[i] === '-'){ const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; }
    return v;
  }
  function term(){
    let v = unary();
    for(;;){
      if(s[i] === '*' || s[i] === '/'){
        const o = s[i++]; const r = unary();
        if(o === '/' && r === 0) bad('Cannot divide by 0');
        v = o === '*' ? v * r : v / r;
      } else if(s[i] === '(' || /[a-z]/.test(s[i] || '')) v *= unary();   // 2(3), 2π
      else break;
    }
    return v;
  }
  function unary(){
    if(s[i] === '-'){ i++; return -unary(); }
    if(s[i] === '+'){ i++; return unary(); }
    return power();
  }
  function power(){
    const b = postfix();
    if(s[i] === '^'){ i++; return Math.pow(b, unary()); }
    return b;
  }
  function postfix(){
    let v = primary();
    while(s[i] === '%'){ i++; v /= 100; }
    return v;
  }
  function primary(){
    if(s[i] === '('){ i++; const v = expr_(); if(s[i] !== ')') bad(); i++; return v; }
    const rest = s.slice(i);
    let m = /^(\d+\.?\d*|\.\d+)/.exec(rest);
    if(m){ i += m[0].length; return parseFloat(m[0]); }
    m = /^[a-z]+/.exec(rest);
    if(m){
      const n = m[0]; i += n.length;
      if(n === 'pi') return Math.PI;
      if(n === 'e') return Math.E;
      if(s[i] !== '(') bad();
      i++; const a = expr_(); if(s[i] !== ')') bad(); i++;
      const rad = deg ? a * Math.PI / 180 : a;
      const clean = x => Math.abs(x) < 1e-12 ? 0 : x;
      switch(n){
        case 'sqrt': if(a < 0) bad('Invalid input'); return Math.sqrt(a);
        case 'sin': return clean(Math.sin(rad));
        case 'cos': return clean(Math.cos(rad));
        case 'tan': if(deg && Math.abs(a % 180) === 90) bad('Undefined'); return clean(Math.tan(rad));
        case 'ln': if(a <= 0) bad('Invalid input'); return Math.log(a);
        case 'log': if(a <= 0) bad('Invalid input'); return Math.log10(a);
        case 'abs': return Math.abs(a);
      }
      bad();
    }
    bad();
  }
  const v = expr_();
  if(i < s.length) bad();
  if(!isFinite(v)) bad('Cannot compute');
  return v;
}
const clean = n => parseFloat(n.toPrecision(12));
function show(n){
  n = clean(n);
  if(Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(6).replace(/\.?0+e/, 'e');
  return n.toLocaleString('en-US', {maximumFractionDigits: 10, useGrouping: false});
}

// ---------- Display ----------
function render(){
  exprEl.textContent = expr;
  exprEl.scrollLeft = exprEl.scrollWidth;
  resEl.classList.remove('err');
  if(done) return;
  resEl.classList.add('pv');
  if(!expr){ resEl.textContent = '0'; resEl.classList.remove('pv'); return; }
  if(/^-?[\d.]+$/.test(expr)){ resEl.textContent = expr; resEl.classList.remove('pv'); return; }
  try { resEl.textContent = show(evaluate(expr.replace(/[+−×÷^(]+$/, ''))); }
  catch(e){ resEl.textContent = resEl.textContent; }
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}
function showMem(){ $('mem').textContent = memory !== 0 ? 'M' : ''; }
function currentValue(){ try { return evaluate(expr || '0'); } catch(e){ return null; } }

// ---------- Actions ----------
function equals(){
  if(!expr || done) return;
  try {
    const full = expr, r = evaluate(expr), txt = show(r);
    history.unshift({e: full, r: txt}); history = history.slice(0, 30); store.set('calc-hist', history);
    exprEl.textContent = full + ' ='; resEl.textContent = txt; resEl.classList.remove('pv');
    expr = txt; done = true; renderHist();
  } catch(err){
    resEl.textContent = err.message; resEl.classList.remove('pv'); resEl.classList.add('err'); done = true; expr = '';
  }
}
function press(k){
  const last = expr.slice(-1);
  if(/^[0-9]$/.test(k)){
    if(done){ expr = ''; done = false; }
    if(last === ')' || last === 'π' || last === 'e') expr += '×';
    expr += k;
  } else if(k === '.'){
    if(done){ expr = ''; done = false; }
    const num = expr.match(/[\d.]*$/)[0];
    if(num.includes('.')) return;
    expr += num === '' ? '0.' : '.';
  } else if(OPS.includes(k)){
    done = false;
    if(!expr){ if(k === '−') expr = '−'; return render(); }
    if(OPS.includes(last) && !(k === '−' && '×÷^'.includes(last))) expr = expr.slice(0, -1);   // swap operator
    const nl = expr.slice(-1);
    if(expr === '' || (nl === '(' && k !== '−')) return render();
    expr += k;
  } else if(k === '(' ){
    if(done){ expr = ''; done = false; }
    if(/[\d)πe]/.test(last)) expr += '×';
    expr += '(';
  } else if(k === ')'){
    const o = (expr.match(/\(/g)||[]).length - (expr.match(/\)/g)||[]).length;
    if(o > 0 && !OPS.includes(last) && last !== '(') expr += ')';
  } else if(k === 'π' || k === 'e'){
    if(done){ expr = ''; done = false; }
    if(/[\d)πe]/.test(last)) expr += '×';
    expr += k;
  } else if(/\($/.test(k)){            // functions like sin(
    if(done){ expr = ''; done = false; }
    if(/[\d)πe]/.test(last)) expr += '×';
    expr += k;
  } else if(k === '%'){
    if(/[\d)]/.test(last)){ done = false; expr += '%'; }
  } else if(k === '±'){
    done = false;
    if(/\(−[\d.]+$/.test(expr)) expr = expr.replace(/\(−([\d.]+)$/, '$1');
    else if(/[\d.]+$/.test(expr)) expr = expr.replace(/([\d.]+)$/, '(−$1');
  } else if(k === 'sq' || k === 'inv'){
    const v = currentValue(); if(v === null) return toast('Finish the expression first');
    expr = k === 'sq' ? `(${expr})^2` : `1÷(${expr})`; done = false;
  } else if(k === 'Backspace'){
    if(done){ expr = ''; done = false; resEl.textContent = '0'; }
    else expr = expr.replace(/(sqrt\(|sin\(|cos\(|tan\(|ln\(|log\(|abs\(|.)$/, '');
  } else if(k === 'AC'){ expr = ''; done = false; }
  else if(k === '=' ){ return equals(); }
  else if(k === 'MC'){ memory = 0; store.set('calc-mem', 0); showMem(); return toast('Memory cleared'); }
  else if(k === 'MR'){ if(memory === 0) return toast('Memory is empty'); if(done){ expr = ''; done = false; } if(/[\d)πe]/.test(last)) expr += '×'; expr += show(memory); }
  else if(k === 'M+' || k === 'M-'){
    const v = currentValue(); if(v === null) return toast('Nothing to store');
    memory += k === 'M+' ? v : -v; memory = clean(memory); store.set('calc-mem', memory); showMem(); return toast('Memory: ' + show(memory));
  }
  render();
}

// ---------- History ----------
function renderHist(){
  const ul = $('histList'); ul.innerHTML = '';
  if(!history.length){ ul.innerHTML = '<p class="none">No calculations yet. Press = to save one here.</p>'; return; }
  history.forEach(h => {
    const li = document.createElement('li'); li.tabIndex = 0;
    const s = document.createElement('small'); s.textContent = h.e + ' =';
    const b = document.createElement('b'); b.textContent = h.r;
    li.append(s, b);
    const use = () => { expr = h.r; done = false; render(); $('hist').classList.remove('open'); };
    li.onclick = use; li.onkeydown = e => { if(e.key === 'Enter') use(); };
    ul.appendChild(li);
  });
}
$('histBtn').onclick = () => { renderHist(); $('hist').classList.add('open'); };
$('closeHist').onclick = () => $('hist').classList.remove('open');
$('clearHist').onclick = () => { history = []; store.set('calc-hist', []); renderHist(); };

// ---------- Controls ----------
$('sciBtn').onclick = e => { const on = $('sci').classList.toggle('show'); e.currentTarget.classList.toggle('on', on); e.currentTarget.setAttribute('aria-pressed', on); store.set('calc-sci', on); };
$('angle').onclick = e => { deg = !deg; e.currentTarget.textContent = deg ? 'DEG' : 'RAD'; if(!done) render(); };
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; store.set('calc-theme', dark ? 'dark' : 'light');
};
$('screen').onclick = () => {
  const txt = resEl.textContent; if(!txt || resEl.classList.contains('err')) return;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied ' + txt), () => toast('Copy not available here'));
};
document.querySelector('.calc').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if(b) press(b.dataset.k); });

const KEYMAP = {'*':'×','/':'÷','-':'−','Enter':'=','Escape':'AC','c':'AC','C':'AC','p':'π'};
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if($('hist').classList.contains('open')){ if(e.key === 'Escape') $('hist').classList.remove('open'); return; }
  let k = e.key;
  if(!(/^[0-9.+\-*/=%^()]$/.test(k) || ['Enter','Escape','Backspace','c','C','p'].includes(k))) return;
  if(e.target.tagName === 'BUTTON' && (k === 'Enter')) return;       // let a focused button handle Enter
  e.preventDefault();
  k = KEYMAP[k] || k;
  press(k);
  const btn = [...document.querySelectorAll('button[data-k]')].find(b => b.dataset.k === k);
  if(btn){ btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 110); }
});

// ---------- Start ----------
const t = store.get('calc-theme', null);
document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if(store.get('calc-sci', false)) $('sciBtn').click();
showMem(); renderHist(); render();
</script>
</body>
</html>
